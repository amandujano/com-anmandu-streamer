name: Docker build & publish

on:
  push:
    branches: [master, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/actionlint@v1.7.12

  release-please:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-publish-develop:
    needs: [lint]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires an all-lowercase image path; github.repository_owner
      # is not guaranteed to be lowercase.
      - name: Compute image name
        run: |
          echo "IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/urbanhub-api" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:develop

  build-and-publish-release:
    needs: [lint, release-please]
    if: github.ref == 'refs/heads/master' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires an all-lowercase image path; github.repository_owner
      # is not guaranteed to be lowercase.
      - name: Compute image name
        run: |
          echo "IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/urbanhub-api" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.release-please.outputs.tag_name }}
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy-develop:
    needs: [build-and-publish-develop]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify webhook
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.COOLIFY_DEVELOP_WEBHOOK_URL }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}")
          echo "Coolify webhook responded with $status"
          if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Coolify webhook call failed with status $status"
            exit 1
          fi
      - name: Wait for app to be healthy
        run: |
          timeout=120
          interval=5
          elapsed=0
          until [ "$elapsed" -ge "$timeout" ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.COOLIFY_DEVELOP_APP_URL }}")
            if [ "$status" = "200" ]; then
              echo "App healthy (HTTP 200)"
              exit 0
            fi
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done
          echo "::error::App did not return HTTP 200 within ${timeout}s"
          exit 1

  deploy-release:
    needs: [build-and-publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify webhook
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.COOLIFY_MASTER_WEBHOOK_URL }}&force=true" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}")
          echo "Coolify webhook responded with $status"
          if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Coolify webhook call failed with status $status"
            exit 1
          fi
      - name: Wait for app to be healthy
        run: |
          timeout=120
          interval=5
          elapsed=0
          until [ "$elapsed" -ge "$timeout" ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.COOLIFY_MASTER_APP_URL }}")
            if [ "$status" = "200" ]; then
              echo "App healthy (HTTP 200)"
              exit 0
            fi
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done
          echo "::error::App did not return HTTP 200 within ${timeout}s"
          exit 1
