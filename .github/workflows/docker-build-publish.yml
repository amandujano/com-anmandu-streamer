name: Docker build & publish

on:
  push:
    branches: [master]

jobs:
  build:

    runs-on: ubuntu-latest
    # Specifies the latest Ubuntu runner for the job environment.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Checks out the repository code into the runner's workspace.

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Sets up JDK 25, using the 'temurin' distribution, and enables Maven caching to speed up the build process.

      - name: Build and Analyze
        run: mvn -B verify
    # Uses Maven to build the application and run SonarQube analysis, skipping tests for faster builds.

  build-and-publish-master:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires an all-lowercase image path; github.repository_owner
      # is not guaranteed to be lowercase.
      - name: Compute image name
        run: |
          echo "IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/com-anmandu-streamer" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
